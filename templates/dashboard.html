<form action="{{ url_for('dashboard', form_type=form_type) }}" method="POST">
    <input type="hidden" name="form_type" value="{{ form_type }}">
    
    <div class="mb-1">
        <label class="form-label-premium">
            {% if form_type == 'duvidas' %}
                SUA PERGUNTA OU DÚVIDA PEDAGÓGICA / LEGISLATIVA
            {% else %}
                CONTEÚDO / OBJETO DE ESTUDO
            {% endif %}
        </label>
        <textarea class="form-control form-control-premium" name="tema" rows="3" placeholder="{% if form_type == 'duvidas' %}Ex: O que a LDB diz sobre a progressão continuada? Como alinhar o DCTMA ao planejamento?{% else %}Ex: Frações, Verbo, Segunda Guerra{% endif %}" required>{{ tema }}</textarea>
    </div>

    {% if form_type != 'duvidas' %}
    <div class="mb-1">
        <label class="form-label-premium">DISCIPLINA</label>
        <input type="text" class="form-control form-control-premium" name="disciplina" value="{{ disciplina if disciplina != 'Componente Curricular' else '' }}" placeholder="Ex: Português, Matemática">
    </div>

    <div class="mb-1">
        <label class="form-label-premium">ANO / TURMA</label>
        <input type="text" class="form-control form-control-premium" name="ano" value="{{ ano }}" placeholder="Ex: 5º ano, 3º ano Ensino Médio">
    </div>
    {% endif %}

    {% if form_type == 'avaliacoes' %}
    {% endif %}

    {% if form_type != 'duvidas' %}
    <div class="mb-3">
        <label class="form-label-premium">DIRETRIZES DA BNCC (OPCIONAL)</label>
        <input type="text" class="form-control form-control-premium" name="bncc" value="{{ bncc }}" placeholder="Insira códigos de habilidades">
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold border-0 shadow-sm" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
        <i class="fa-solid fa-wand-magic-sparkles me-2"></i>{% if form_type == 'duvidas' %}Consultar Especialista IA{% else %}Gerar Documento com IA{% endif %}
    </button>
</form>
