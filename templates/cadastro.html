<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor IA</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <!-- Fonte Inter do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 460px;
        }
        .brand-logo {
            font-size: 2.5rem;
            color: #6366f1;
            text-align: center;
            margin-bottom: 8px;
        }
        .brand-name {
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 4px;
            font-size: 1.5rem;
        }
        .brand-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }
        .form-label {
            font-weight: 500;
            color: #334155;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }
        .btn-register {
            background-color: #6366f1;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .btn-register:hover {
            background-color: #4f46e5;
        }
        .alert {
            border-radius: 8px;
            font-size: 0.85rem;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .login-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <div class="brand-name">Criar Conta de Professor</div>
        <div class="brand-subtitle">Preencha os campos abaixo para liberar seu acesso</div>
        
        {% if erro %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>{{ erro }}</div>
        </div>
        {% endif %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Samuel Araújo Sousa" required>
            </div>
            <div class="mb-3">
                <label for="escola" class="form-label">Nome da Escola / Instituição</label>
                <input type="text" class="form-control" id="escola" name="escola" placeholder="Ex: Fábrica de Software" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail Corporativo ou Pessoal</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="mb-4">
                <label for="senha" class="form-label">Defina uma Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn-register">Finalizar Cadastro</button>
        </form>

        <div class="login-link">
            Já possui acesso? <a href="{{ url_for('login') }}">Fazer Login</a>
        </div>
    </div>

</body>
</html>
