<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor IA</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .card-cadastro { width: 100%; max-width: 460px; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="card card-cadastro p-4 bg-white">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark m-0">Criar Nova Conta</h4>
            <p class="text-secondary small mt-1">Insira os seus dados para acessar a plataforma</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger small p-2 text-center"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ erro }}</div>
        {% endif %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">NOME COMPLETO</label>
                <input type="text" class="form-control py-2" name="nome" placeholder="Ex: Prof. Samuel Araújo" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">NOME DA ESCOLA / INSTITUIÇÃO</label>
                <input type="text" class="form-control py-2" name="escola" placeholder="Ex: U.E. Prof. João Martins Neto" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">ENDEREÇO DE E-MAIL</label>
                <input type="email" class="form-control py-2" name="email" placeholder="seuemail@escola.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">CRIE UMA SENHA</label>
                <input type="password" class="form-control py-2" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3">Finalizar Cadastro</button>
        </form>

        <div class="text-center border-top pt-3 mt-1">
            <span class="text-secondary small">Já tem cadastro?</span>
            <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none ms-1">Fazer Login</a>
        </div>
    </div>
</body>
</html>
