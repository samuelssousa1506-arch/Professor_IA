<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-cadastro {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 35px;
        }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark m-0">Criar Conta</h3>
            <p class="text-muted small mt-1">Cadastre seus dados institucionais para acesso completo</p>
        </div>
        
        {% if erro %}<div class="alert alert-danger small py-2 px-3 rounded-3">{{ erro }}</div>{% endif %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">NOME COMPLETO</label>
                <input type="text" class="form-control" name="nome" placeholder="Ex: Samuel Araújo Sousa" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">UNIDADE ESCOLAR / ESCOLA</label>
                <input type="text" class="form-control" name="escola" placeholder="Ex: U.E. Prof. João Martins Neto" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">E-MAIL</label>
                <input type="email" class="form-control" name="email" placeholder="nome@escola.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">SENHA</label>
                <input type="password" class="form-control" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold border-0" style="background: linear-gradient(135deg, #10b981, #059669);">Concluir Cadastro</button>
        </form>
        
        <p class="text-center small text-muted mt-4 mb-0">
            Já possui uma conta? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">Faça login</a>
        </p>
    </div>
</body>
</html>
