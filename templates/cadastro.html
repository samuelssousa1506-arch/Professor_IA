<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-950: #0a1f3f;
            --azul-900: #0e2a5e;
            --azul-700: #1b4da6;
            --azul-600: #2563eb;
            --borda: #dbe6f5;
            --tinta-suave: #52627e;
        }
        body {
            background: linear-gradient(160deg, var(--azul-950) 0%, var(--azul-900) 30%, #f4f7fb 30%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .marca-topo {
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
        }
        .marca-topo .icone {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }
        .marca-topo h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            margin: 0;
        }
        .card-cadastro {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(10, 31, 63, 0.18);
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 36px;
        }
        .card-cadastro h3 { font-family: 'Sora', sans-serif; font-weight: 700; }
        .form-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--tinta-suave);
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid var(--borda);
            padding: 0.6rem 0.8rem;
        }
        .form-control:focus {
            border-color: var(--azul-600);
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }
        .btn-criar {
            background: linear-gradient(135deg, var(--azul-700), var(--azul-600));
            border: none;
            color: #fff;
            font-weight: 700;
            border-radius: 8px;
            padding: 0.65rem;
        }
        .btn-criar:hover { filter: brightness(1.05); color: #fff; }
    </style>
</head>
<body>
    <div class="marca-topo">
        <div class="icone"><i class="fa-solid fa-graduation-cap"></i></div>
        <h1>Professor IA</h1>
    </div>

    <div class="card-cadastro">
        <div class="text-center mb-4">
            <h3 class="text-dark m-0">Criar Conta</h3>
            <p class="text-muted small mt-1">Cadastre seus dados institucionais para acesso completo</p>
        </div>

        {% if erro %}<div class="alert alert-danger small py-2 px-3 rounded-3">{{ erro }}</div>{% endif %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">NOME COMPLETO</label>
                <input type="text" class="form-control" name="nome" placeholder="Ex: Samuel Araújo Sousa" required>
            </div>
            <div class="mb-3">
                <label class="form-label">UNIDADE ESCOLAR / ESCOLA</label>
                <input type="text" class="form-control" name="escola" placeholder="Ex: U.E. Prof. João Martins Neto" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-MAIL</label>
                <input type="email" class="form-control" name="email" placeholder="nome@escola.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">SENHA</label>
                <input type="password" class="form-control" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn btn-criar w-100">Concluir Cadastro</button>
        </form>

        <p class="text-center small text-muted mt-4 mb-0">
            Já possui uma conta? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: var(--azul-700);">Faça login</a>
        </p>
    </div>
</body>
</html>
