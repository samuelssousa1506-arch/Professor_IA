<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Professor IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-950: #060f24;
            --azul-900: #0c1d3d;
            --azul-800: #123a7a;
            --azul-700: #1b4da6;
            --azul-600: #2563eb;
            --ouro-400: #d4a743;
            --ouro-500: #b3811f;
            --borda: #dfe7f4;
            --tinta-suave: #52627e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: radial-gradient(1200px 700px at 80% -10%, #16305f 0%, transparent 60%),
                        radial-gradient(1000px 650px at 0% 10%, #1b2e57 0%, transparent 55%),
                        linear-gradient(160deg, var(--azul-950) 0%, var(--azul-900) 32%, #f4f7fb 32%);
        }
        .halo { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .32; pointer-events: none; animation: derivar 16s ease-in-out infinite alternate; }
        .halo-1 { width: 400px; height: 400px; top: -110px; right: -90px; background: radial-gradient(circle, rgba(212,167,67,.5), transparent 70%); }
        .halo-2 { width: 360px; height: 360px; top: 60px; left: -110px; background: radial-gradient(circle, rgba(37,99,235,.5), transparent 70%); animation-delay: -6s; }
        @keyframes derivar { from { transform: translate(0,0) scale(1); } to { transform: translate(-25px,18px) scale(1.08); } }
        @keyframes subirEntrar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

        .marca-topo { color: #ffffff; text-align: center; margin-bottom: 24px; position: relative; z-index: 1; animation: subirEntrar .6s cubic-bezier(.22,.61,.36,1) both; }
        .selo-emblema {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #1a3a72, var(--azul-950));
            border: 1.5px solid rgba(212,167,67,0.55);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--ouro-400); margin-bottom: 8px;
            box-shadow: 0 0 0 5px rgba(212,167,67,0.08), 0 10px 24px -8px rgba(0,0,0,0.5);
        }
        .marca-topo h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.35rem; margin: 0; }
        .marca-topo h1 em { color: var(--ouro-400); font-style: italic; font-weight: 500; }

        .card-cadastro {
            border: none; border-radius: 18px;
            box-shadow: 0 30px 60px -20px rgba(6, 15, 36, 0.45);
            width: 100%; max-width: 440px; background: #ffffff; padding: 38px;
            position: relative; z-index: 1;
            animation: subirEntrar .6s .08s cubic-bezier(.22,.61,.36,1) both;
        }
        .card-cadastro::before {
            content: ""; position: absolute; top: 0; left: 14%; right: 14%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--ouro-400), transparent);
        }
        .card-cadastro h3 { font-family: 'Fraunces', serif; font-weight: 600; }
        .form-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave); }
        .form-control {
            border-radius: 9px; border: 1px solid var(--borda); padding: 0.65rem 0.85rem;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .form-control:focus { border-color: var(--azul-600); box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.14); }
        .btn-criar {
            background: linear-gradient(135deg, var(--azul-700), var(--azul-600));
            border: none; color: #fff; font-weight: 700; border-radius: 9px; padding: 0.7rem;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 22px -8px rgba(27,77,166,0.55);
            transition: transform .18s ease, filter .18s ease;
        }
        .btn-criar::after {
            content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-20deg); transition: left .5s ease;
        }
        .btn-criar:hover { filter: brightness(1.05); color: #fff; transform: translateY(-1px); }
        .btn-criar:hover::after { left: 130%; }
        .alert { border-radius: 9px; border: none; }
    </style>
</head>
<body>
    <div class="halo halo-1"></div>
    <div class="halo halo-2"></div>

    <div class="marca-topo">
        <div class="selo-emblema"><i class="fa-solid fa-graduation-cap"></i></div>
        <h1>Professor <em>IA</em></h1>
    </div>

    <div class="card-cadastro">
        <div class="text-center mb-4">
            <h3 class="text-dark m-0">Criar Conta</h3>
            <p class="text-muted small mt-1">Cadastre seus dados institucionais para acesso completo</p>
        </div>

        {% if erro %}<div class="alert alert-danger small py-2 px-3">{{ erro }}</div>{% endif %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">NOME COMPLETO</label>
                <input type="text" class="form-control" name="nome" placeholder="Ex: Samuel Araújo Sousa" required>
            </div>
            <div class="mb-3">
                <label class="form-label">UNIDADE ESCOLAR / ESCOLA</label>
                <input type="text" class="form-control" name="escola" placeholder="Ex: U.E. Prof. João Martins Neto" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-MAIL</label>
                <input type="email" class="form-control" name="email" placeholder="nome@escola.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">SENHA</label>
                <input type="password" class="form-control" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn btn-criar w-100">Concluir Cadastro</button>
        </form>

        <p class="text-center small text-muted mt-4 mb-0">
            Já possui uma conta? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: var(--azul-700);">Faça login</a>
        </p>
    </div>
</body>
</html>
