{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="editor-box" style="max-width: 820px;">
        <h3 class="fw-bold mb-3" style="font-family:'Fraunces',serif; color: var(--tinta);">Editar Material</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase" style="letter-spacing:.05em; color: var(--tinta-suave);">Título</label>
                <input type="text" name="titulo" class="form-control" style="border-radius:8px; border-color: var(--borda);" value="{{ material[1] }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase" style="letter-spacing:.05em; color: var(--tinta-suave);">Conteúdo (HTML)</label>
                <textarea name="conteudo" class="form-control" rows="15" style="font-family:'Courier New',monospace; border-radius:8px; border-color: var(--borda);">{{ material[2] }}</textarea>
            </div>
            <button type="submit" class="btn fw-bold text-white" style="background: linear-gradient(135deg, var(--azul-800), var(--azul-600)); border-radius: 8px;">
                <i class="fa-solid fa-floppy-disk me-1"></i> Salvar Alterações
            </button>
            <a href="{{ url_for('biblioteca') }}" class="btn btn-light border" style="border-radius: 8px;">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
