{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h3 class="fw-bold">Editar Material</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" value="{{ material[1] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Conteúdo (HTML)</label>
            <textarea name="conteudo" class="form-control" rows="15" style="font-family:monospace;">{{ material[2] }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Salvar Alterações</button>
        <a href="{{ url_for('biblioteca') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
