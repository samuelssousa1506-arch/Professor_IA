<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Professor IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 32px;
        }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark m-0">Professor <span class="text-primary">IA</span></h3>
            <p class="text-muted small mt-1">Insira as suas credenciais para aceder ao painel</p>
        </div>
        
        {% if erro %}
            <div class="alert alert-danger small py-2 px-3 rounded-3" role="alert">{{ erro }}</div>
        {% endif %}
        {% if sucesso %}
            <div class="alert alert-success small py-2 px-3 rounded-3" role="alert">{{ sucesso }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">E-MAIL INSTITUCIONAL</label>
                <input type="email" class="form-control" name="email" placeholder="nome@exemplo.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">PALAVRA-PASSE</label>
                <input type="password" class="form-control" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none;">Aceder ao Painel</button>
        </form>
        
        <p class="text-center small text-muted mt-4 mb-0">
            Não tem uma conta? <a href="{{ url_for('cadastro') }}" class="fw-bold text-decoration-none">Registe-se aqui</a>
        </p>
    </div>
</body>
</html>
