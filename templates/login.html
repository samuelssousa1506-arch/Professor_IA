<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Professor IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; p: 15px; }
        .card-login { width: 100%; max-width: 420px; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="card card-login p-4 bg-white">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-block p-3 rounded-circle mb-3">
                <i class="fa-solid fa-graduation-cap fa-2x"></i>
            </div>
            <h4 class="fw-bold text-dark">Professor IA</h4>
            <p class="text-secondary small">Planeamentos escolares com Inteligência Artificial</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger small p-2 text-center"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ erro }}</div>
        {% endif %}
        {% if sucesso %}
            <div class="alert alert-success small p-2 text-center"><i class="fa-solid fa-circle-check me-2"></i>{{ sucesso }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">E-MAIL</label>
                <input type="email" class="form-control py-2" name="email" placeholder="seuemail@escola.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">SENHA</label>
                <input type="password" class="form-control py-2" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Entrar no Sistema</button>
        </form>

        <div class="text-center border-top pt-3 mt-2">
            <span class="text-secondary small">Não tem uma conta?</span>
            <a href="{{ url_for('cadastro') }}" class="small fw-bold text-decoration-none ms-1">Cadastre-se aqui</a>
        </div>
    </div>
</body>
</html>
