{% extends 'base.html' %}
{% block title %}Pastas - Professor IA{% endblock %}
{% block content %}
<div class="container py-4">
    <h3 class="fw-bold mb-3"><i class="fa-regular fa-folder me-2"></i>Gerenciar Pastas</h3>
    <div class="row">
        <div class="col-md-4">
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label fw-bold">Nome da pasta</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label fw-bold">Cor</label>
                    <input type="color" name="cor" class="form-control form-control-color" value="#6c757d">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-regular fa-plus"></i> Criar pasta</button>
            </form>
        </div>
        <div class="col-md-8">
            <h6 class="fw-bold">Suas pastas</h6>
            {% if pastas %}
                <ul class="list-group">
                {% for p in pastas %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:{{ p.cor }};"></span> {{ p.nome }}</span>
                        <form action="{{ url_for('excluir_pasta', pasta_id=p.id) }}" method="POST" onsubmit="return confirm('Excluir esta pasta? Os materiais serão movidos para "Sem pasta".');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fa-regular fa-trash"></i></button>
                        </form>
                    </li>
                {% endfor %}
                </ul>
            {% else %}
                <p class="text-muted">Nenhuma pasta criada.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
