{% extends 'base.html' %}
{% block title %}Gerenciar Usuários - Admin{% endblock %}
{% block content %}
<div class="container py-4">
    <h3 class="fw-bold"><i class="fa-regular fa-users me-2"></i>Gerenciar Usuários</h3>
    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>Email</th><th>Escola</th><th>Role</th><th>Ativo</th><th>Ações</th></tr>
        </thead>
        <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.nome }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.escola }}</td>
            <td>
                <form action="{{ url_for('admin_role_usuario', id=u.id) }}" method="POST" style="display:inline;">
                    <select name="role" class="form-select form-select-sm" style="width: auto; display:inline-block;" onchange="this.form.submit()">
                        <option value="professor" {% if u.role == 'professor' %}selected{% endif %}>Professor</option>
                        <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </form>
            </td>
            <td>
                <form action="{{ url_for('admin_toggle_usuario', id=u.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-sm {% if u.ativo %}btn-success{% else %}btn-secondary{% endif %}">
                        {% if u.ativo %}Ativo{% else %}Inativo{% endif %}
                    </button>
                </form>
            </td>
            <td>
                <form action="{{ url_for('admin_toggle_usuario', id=u.id) }}" method="POST" style="display:inline;">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Desativar este usuário?')">Desativar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
